<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Authorization Manager Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div th:insert="~{header :: jumbotron}"></div>
    <div class="row p-3">
        <div class="col-2 admin-sidebar" th:with="activeLink=Home" th:insert="~{leftnav :: menu}"></div>
        <div class="col-sm admin-main-panel">
            <div class="admin-content-panel">
                <p class="text-uppercase fw-bold text-danger small mb-2">Request unavailable</p>
                <h1 class="admin-page-title">The requested page could not be opened.</h1>
                <p class="admin-page-text">
                    You may not have access to this resource, or the request could not be completed.
                </p>
                <div class="alert alert-light border mt-4" th:if="${status}">
                    <span class="fw-semibold">Status:</span> <span th:text="${status}"></span>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button type="button" class="btn btn-outline-secondary" onclick="history.back()">Go back</button>
                    <a class="btn btn-primary" th:href="@{/admin/dashboard}">Admin dashboard</a>
                </div>
            </div>
        </div>
    </div>
    <div class="admin-footer">
        <div th:insert="~{footer :: copyright}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
