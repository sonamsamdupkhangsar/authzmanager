<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Organization Role</title>
    <script th:inline="javascript">
        function deleteRole(url, returnUrl) {
            if (!confirm("Do you really want to delete this role?")) {
                return false;
            }
            const request = new XMLHttpRequest();
            request.open("DELETE", url, true);
            request.onload = function () {
                window.location.replace(returnUrl);
            };
            request.send();
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div th:insert="~{header :: jumbotron}"></div>
    <div class="row p-3">
        <div class="col-2 admin-sidebar" th:with="activeLink=Organizations" th:insert="~{leftnav :: menu}"></div>
        <div class="col-sm admin-main-panel">
            <ul class="nav nav-tabs" th:if="${organization}">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/organizations/{id}(id=${organization.id})}">Organization</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/admin/organizations/{id}/roles(id=${organization.id})}">Roles</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/organizations/{id}/users(id=${organization.id})}">User association</a>
                </li>
            </ul>

            <h1 th:text="${role != null and role.id != null} ? 'Edit role' : 'Create role'"></h1>
            <p class="text-muted" th:if="${organization}" th:text="${organization.name}"></p>

            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="mb-3" th:if="${role != null and role.id != null and organization != null}">
                <button class="btn btn-danger"
                        th:with="deleteUrl=@{/admin/organizations/{organizationId}/roles/{roleId}(organizationId=${organization.id},roleId=${role.id})}, returnUrl=@{/admin/organizations/{organizationId}/roles(organizationId=${organization.id})}"
                        th:onclick="deleteRole([[${deleteUrl}]], [[${returnUrl}]])">Delete role</button>
            </div>

            <form th:if="${role != null and organization != null}"
                  th:action="@{/admin/organizations/{organizationId}/roles(organizationId=${organization.id})}"
                  th:object="${role}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label for="name" class="form-label">Role name</label>
                    <p th:if="${#fields.hasErrors('name')}" class="text-danger">Please enter a role name between 3 and 50 characters.</p>
                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="role name"/>
                </div>
                <button type="submit" class="btn btn-primary">Save role</button>
                <a class="btn btn-secondary"
                   th:href="@{/admin/organizations/{organizationId}/roles(organizationId=${organization.id})}">Cancel</a>
            </form>
        </div>
    </div>
    <div class="admin-footer">
        <div th:insert="~{footer :: copyright}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
</body>
</html>
